cubes:
  - name: fct_orders_activity
    sql: >
      SELECT
        row_number() OVER () AS surrogate_id,
        customer_id,
        order_id,
        order_creation_date
      FROM ecommerce_dw_mart_ecommerce.fct_orders

    public: false
    
    joins:
      - name: fct_orders
        sql: "{CUBE}.order_id = {fct_orders.order_id}"
        relationship: one_to_one

    dimensions:
      - name: surrogate_id
        sql: surrogate_id
        type: number
        primary_key: true
      - name: order_creation_date
        sql: order_creation_date
        type: time

    measures:
      - name: daily_active_users
        type: count_distinct
        sql: customer_id
        rolling_window:
          trailing: 1 day
          offset: start

      - name: weekly_active_users
        type: count_distinct
        sql: customer_id
        rolling_window:
          trailing: 7 day
          offset: start

      - name: monthly_active_users
        type: count_distinct
        sql: customer_id
        rolling_window:
          trailing: 30 day
          offset: start

      - name: wau_to_mau
        title: WAU to MAU
        type: number
        sql: "{weekly_active_users} / NULLIF({monthly_active_users}, 0)"
