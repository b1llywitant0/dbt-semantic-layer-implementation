{% set model = dbt_model('dim_customers') %}
 
cubes:
  - name: dim_leads
    sql: >
      SELECT * FROM ecommerce_dw_mart_ecommerce.dim_customers
      WHERE is_current = 1 AND deleted = 0
 
    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['valid_from', 'valid_to'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['customer_sk'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}
 
    measures:
      - name: count
        type: count
