{% set model = dbt_model('dim_customers') %}
 
cubes:
  - name: dim_customers
    sql: >
      SELECT * FROM ecommerce_dw_mart_ecommerce.dim_customers
      WHERE is_current = 1 AND deleted = 0
    
    public: false

    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['valid_from', 'valid_to'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['customer_sk'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}
      - name: avg_order_value
        sql: "{fct_orders.gmv} / {fct_orders.order_count}"
        type: number
        sub_query: true

    measures:
      - name: count
        type: count

      - name: n_of_customers
        sql: account_id
        type: count_distinct

      - name: n_of_users
        sql: user_id
        type: count_distinct

      - name: avg_order_value_per_account
        sql: "{avg_order_value}"
        type: avg

  - name: user_aggregation
    sql: >
        SELECT
            dim_customers.user_id AS user_id,
            SUM(fct_orders.order_value) AS total_order_value,
            COUNT(DISTINCT fct_orders.order_id) AS order_count,
            SUM(fct_orders.order_value) / COUNT(DISTINCT fct_orders.order_id) AS average_order_value
        FROM ecommerce_dw_mart_ecommerce.fct_orders
        LEFT JOIN ecommerce_dw_mart_ecommerce.dim_customers
        ON ecommerce_dw_mart_ecommerce.fct_orders.customer_id = ecommerce_dw_mart_ecommerce.dim_customers.account_id
        GROUP BY user_id

    measures:
      - name: avg_order_value_per_user
        sql: average_order_value
        type: avg
