{% set model = dbt_model('fct_lead_revenue') %}
 
cubes:
  - {{ model.as_cube() }}
 
    public: false

    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['won_date','order_delivered_carrier_date'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['mql_id'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_value'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: number
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}

    joins:
      - name: dim_leads
        sql: "{CUBE}.mql_id = {dim_leads.mql_id}"
        relationship: many_to_one
      - name: fct_orders
        sql: "{CUBE}.order_id = {fct_orders.order_id}"
        relationship: many_to_one
      - name: dim_sellers
        sql: "{CUBE}.seller_id = {dim_sellers.seller_id}"
        relationship: many_to_one

    measures:
      - name: count
        type: count

      - name: n_of_sellers
        sql: mql_id
        type: count_distinct

      - name: order_count
        sql: order_id
        type: count_distinct
              
      - name: gmv
        sql: order_value
        type: sum

      - name: max_order_value
        sql: order_value
        type: max

      - name: min_order_value
        sql: order_value
        type: min

      - name: avg_order_value
        sql: order_value
        type: avg

      - name: max_order_delivered_carrier_date
        sql: order_delivered_carrier_date
        type: max

      - name: latest_order
        sql: order_id
        type: string
        filters:
          - sql: "{CUBE.order_delivered_carrier_date} = {max_order_delivered_carrier_date}"
