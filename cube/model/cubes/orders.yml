{% set model = dbt_model('fct_orders') %}
 
cubes:
  - {{ model.as_cube() }}

    public: false

    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['order_creation_date','shipping_limit_date','order_estimated_delivery_date'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_id'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_value'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: number
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}

    joins:
      - name: dim_customers
        sql: "{CUBE}.customer_id = {dim_customers.account_id}"
        relationship: many_to_one

    measures:
      - name: count
        type: count

      - name: active_user_count
        sql: customer_id
        type: count_distinct

      - name: order_count
        sql: order_id
        type: count_distinct
              
      - name: completed_order_count
        sql: order_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.order_status = 'delivered'"
      
      - name: canceled_order_count
        sql: order_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.order_status = 'canceled'"

      - name: gmv
        sql: order_value
        type: sum

      - name: first_order_date
        sql: "MIN({CUBE}.order_creation_date)"
        type: time

      - name: latest_order_date
        sql: "MAX({CUBE}.order_creation_date)"
        type: time

      - name: max_order_value
        sql: order_value
        type: max

      - name: min_order_value
        sql: order_value
        type: min

      - name: avg_order_value
        sql: order_value
        type: avg

      - name: monthly_active_users
        type: count_distinct
        sql: customer_id
        rolling_window:
          trailing: 30 day
          offset: start
 
      - name: weekly_active_users
        type: count_distinct
        sql: customer_id
        rolling_window:
          trailing: 7 day
          offset: start
 
      - name: daily_active_users
        type: count_distinct
        sql: customer_id
        rolling_window:
          trailing: 1 day
          offset: start
 
      - name: wau_to_mau
        title: WAU to MAU
        type: number
        sql:
          "{weekly_active_users} / NULLIF({monthly_active_users}, 0)"
          