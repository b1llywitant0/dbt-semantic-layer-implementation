{% set model = dbt_model('fct_orders') %}
 
cubes:
  - {{ model.as_cube() }}
 
    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['order_creation_date','shipping_limit_date','estimated_delivery_date'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_id'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_value'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: number
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}

    joins:
      - name: dim_customers
        sql: "{CUBE}.customer_id = {dim_customers.account_id}"
        relationship: many_to_one

    measures:
      - name: count
        type: count

      - name: order_count
        sql: order_id
        type: count_distinct
              
      - name: gmv
        sql: order_value
        type: sum

      - name: max_order_value
        sql: order_value
        type: max

      - name: min_order_value
        sql: order_value
        type: min

      - name: avg_order_value
        sql: order_value
        type: avg
