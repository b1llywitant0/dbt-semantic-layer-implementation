{% set model = dbt_model('dim_leads') %}
 
cubes:
  - {{ model.as_cube() }}
 
    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['valid_from', 'valid_to'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}
 
    measures:
      - name: count
        type: count
