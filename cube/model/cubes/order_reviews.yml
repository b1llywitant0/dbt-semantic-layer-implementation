{% set model = dbt_model('fct_order_reviews') %}
 
cubes:
  - {{ model.as_cube() }}

    public: false
 
    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['review_creation_date','review_answer_timestamp'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_review_sk'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['review_score'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: number
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}

    joins:
      - name: fct_orders
        sql: "{CUBE}.order_id = {fct_orders.order_id}"
        relationship: many_to_one
      - name: dim_customers
        sql: "{CUBE}.customer_id = {dim_customers.account_id}"
        relationship: many_to_one
      - name: review_order_items
        sql: "{CUBE}.order_review_sk = {review_order_items.id} AND {CUBE}.review_id = {review_order_items.review_id}"
        relationship: many_to_one

    measures:
      - name: count_reviews
        type: count

      - name: average_review_score
        sql: review_score
        type: avg

  - name: review_order_items
    sql: >
      SELECT
        order_review_sk,
        review_id,
        order_id,
        MIN(review_answer_timestamp) AS review_answer_timestamp
      FROM ecommerce_dw_mart_ecommerce.fct_order_reviews
      GROUP BY 1, 2, 3
    
    public: false

    joins:
      - name: fct_order_items
        relationship: one_to_many
        sql: "{CUBE}.order_id = {fct_order_items}.order_id"
      - name: fct_order_payments
        relationship: one_to_many
        sql: "{CUBE}.order_id = {fct_order_payments}.order_id"
      - name: fct_orders
        relationship: many_to_one
        sql: "{CUBE}.order_id = {fct_orders}.order_id"

    measures:
      - name: count
        type: count

    dimensions:
      - name: id
        sql: order_review_sk
        type: string
        primary_key: true
      - name: review_id
        sql: review_id
        type: string
      - name: order_id
        sql: order_id
        type: string
