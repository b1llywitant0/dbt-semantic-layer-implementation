{% set model = dbt_model('fct_order_payments') %}
 
cubes:
  - {{ model.as_cube() }}

    public: false
 
    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['order_creation_date'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_id'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['payment_installments','payment_sequential','total_payment_value'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: number
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}

    joins:
      - name: fct_orders
        sql: "{CUBE}.order_id = {fct_orders.order_id}"
        relationship: many_to_one
      - name: fct_order_items
        sql: "{CUBE}.order_id = {fct_order_items.order_id}"
        relationship: has_many

    measures:
      - name: count
        type: count

      - name: sum_payment_value
        sql: total_payment_value
        type: sum

      - name: average_payment_value
        sql: total_payment_value
        type: avg

