{% set model = dbt_model('customer_retention') %}
 
cubes:
  - {{ model.as_cube() }}
    
    public: false

    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['cohort'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: number
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}

    measures:
      - name: count
        type: count
