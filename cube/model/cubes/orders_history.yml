{% set model = dbt_model('fct_orders_history') %}
 
cubes:
  - name: fct_orders_history
    sql: >
      SELECT * FROM ecommerce_dw_mart_ecommerce.fct_orders_history
      WHERE is_current = 1

    public: false
 
    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['order_purchase_timestamp','order_approved_at','order_delivered_carrier_date','order_delivered_customer_date','order_estimated_delivery_date','valid_from','valid_to'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_sk'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['late_delivery'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: number
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}

    joins:
      - name: fct_orders
        sql: "{CUBE}.order_id = {fct_orders.order_id}"
        relationship: one_to_one

    measures:
      - name: count
        type: count

      - name: order_count
        sql: order_id
        type: count_distinct

      - name: unprocessed_count
        sql: order_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.order_status = 'created'"

      - name: processed_count
        sql: order_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.order_status IN ('approved','invoiced','processing')"

      - name: shipped_count
        sql: order_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.order_status = 'shipped'"

      - name: delivered_count
        sql: order_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.order_status = 'delivered'"

      - name: canceled_count
        sql: order_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.order_status = 'canceled'"

      - name: late_delivery_count
        sql: late_delivery
        type: sum

      - name: on_time_delivery_count
        sql: late_delivery
        type: count
        filters:
          - sql: >
              {CUBE}.late_delivery = 0 AND
              {CUBE}.order_status = 'delivered'

      - name: order_to_shipped
        sql: "(dateDiff('day', toDateTime64({CUBE}.order_purchase_timestamp, 0), toDateTime64({CUBE}.order_delivered_carrier_date, 0)))"
        type: avg

      - name: shipped_to_delivered
        sql: "(dateDiff('day', toDateTime64({CUBE}.order_delivered_carrier_date, 0), toDateTime64({CUBE}.order_delivered_customer_date, 0)))"
        type: avg

      - name: order_to_delivery
        sql: "(dateDiff('day', toDateTime64({CUBE}.order_purchase_timestamp, 0), toDateTime64({CUBE}.order_delivered_customer_date, 0)))"
        type: avg
