{% set model = dbt_model('fct_orders_history') %}
 
cubes:
  - {{ model.as_cube() }}

    public: false
 
    dimensions:
      {% for column in model.columns %}
        {% if column.name in ['order_purchase_timestamp','order_approved_at','order_delivered_carrier_date','order_delivered_customer_date','order_estimated_delivery_date','valid_from','valid_to'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: time
        description: {{ column.description }}
        meta:
          source: dbt
        {% elif column.name in ['order_sk'] %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        primary_key: true
        description: {{ column.description }}
        meta:
          source: dbt
        {% else %}
      - name: {{ column.name }}
        sql: {{ column.sql }}
        type: {{ column.type }}
        description: {{ column.description }}
        meta:
          source: dbt    
        {% endif %}
      {% endfor %}

    joins:
      - name: fct_orders
        sql: "{CUBE}.order_id = {fct_orders.order_id}"
        relationship: many_to_one
      - name: fct_order_items
        sql: "{CUBE}.order_id = {fct_order_items.order_id}"
        relationship: has_many
      - name: fct_order_payments
        sql: "{CUBE}.order_id = {fct_order_payments.order_id}"
        relationship: has_many

    measures:
      - name: count
        type: count
