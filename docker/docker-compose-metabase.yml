services:
  metabase:
    image: metabase/metabase:latest
    container_name: finpro-metabase
    hostname: metabase
    ports:
      - 3000:3000
    volumes:
      - '../metabase/plugin/clickhouse.metabase-driver.jar:/plugins/clickhouse.jar'
      - ../metabase/data:/metabase-data
    environment:
      MB_HTTP_TIMEOUT: "5000"
      JAVA_TIMEZONE: ${TIMEZONE}
      MB_DB_FILE: "/metabase-data/metabase.db"
    networks:
      - finpro-network
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  finpro-network:
    driver: bridge
    external: true