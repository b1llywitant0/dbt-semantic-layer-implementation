version: 2

models:
  - name: fct_order_reviews
    descriptions: Fact table which record information of order reviews.
    tests: 
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_id
            - order_id
    columns:
      - name: review_id
        description: Indicating the review of order. Strangely, there are review ID for multiple order ID.
        tests:
          - not_null
      - name: order_id
        description: Indicating the order being reviewed.
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: customer_id
        description: Indicating the account associated with the review.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: account_id
      - name: review_score
        description: Satisfactory level of customer towards the order.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5
              inclusive: true
      - name: review_comment_title
        description: Title of review
      - name: review_comment_message
        description: Message of review
      - name: review_creation_date
        description: Shows the date in which the satisfaction survey was sent to the customer.
        tests:
          - not_null
      - name: review_answer_timestamp
        description: Shows satisfaction survey answer timestamp.
        tests:
          - not_null
      - name: deleted
        description: Boolean indicating whether the data is deleted or not, either from soft-delete or hard-delete.
        tests:
          - not_null
          - accepted_values:
              values:
                - 0
                - 1
