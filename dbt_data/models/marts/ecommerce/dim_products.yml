version: 2

models:
  - name: dim_products
    descriptions: Dimension table for products, containing the attributes of products with SCD2 tracking including deletion.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_id
            - valid_from
            - valid_to
    columns:
      - name: product_id
        description: Indicating unique product.
        tests:
          - not_null
      - name: product_category
        description: Indicating the category of the product.
        tests:
          - not_null
      - name: product_weight_g
        description: Product weigth in gram.
        tests:
          - dbt_utils.expression_is_true:
              expression: '> 0'
      - name: product_length_cm
        description: Product length in cm.
        tests:
          - dbt_utils.expression_is_true:
              expression: '> 0'
      - name: product_height_cm
        description: Product height in cm.
        tests:
          - dbt_utils.expression_is_true:
              expression: '> 0'
      - name: product_width_cm
        description: Product width in cm.
        tests:
          - dbt_utils.expression_is_true:
              expression: '> 0'
      - name: product_volume_cm3
        description: Dynamically created by multiplying length, height, and width of the product.
        tests:
          - dbt_utils.expression_is_true:
              expression: '> 0'
      - name: deleted
        description: Indicating deletion.
        tests:
          - not_null
      - name: valid_from
        description: Timestamp of data validity period - beginning.
        tests:
          - not_null
      - name: valid_to
        description: Timestamp of data validity period - end.
        tests:
          - not_null
      - name: is_current
        description: Indicating the latest data.
        tests:
          - accepted_values:
              values:
                - 0
                - 1
