version: 2

models:
  - name: dim_leads
    descriptions: >
      Dimension table for leads, containing the attributes of leads with SCD2 tracking for lead status change, including deletion.
      For now, the lead status change only based on whether the lead exist in closed deal or not, since the data given by Olist is limited.
      All of the data, except channel, retrieved post-closed deal.
      About lead behaviour, Olist didn't give the explanation behind the classification.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - mql_id
            - valid_from
            - valid_to
    columns:
      - name: lead_sk
        description: Surrogate key for SCD2 table.
        tests:
          - unique
          - not_null
      - name: mql_id
        description: Indicating unique qualified lead. Primary key of the table.
        tests:
          - not_null
      - name: channel
        description: Indicating the source marketing attribute of the lead. In simply, where the lead came from.
        tests:
          - not_null
      - name: status
        description: Indicating the status of the lead.
        tests:
          - not_null
      - name: lead_type
        description: Mainly indicating whether the business is online or offline, with its business scale.
      - name: business_segment
        description: Indicating the main product the business sold. Several values are aligned with product category table.
      - name: business_type
        description: Indicating whether the business is reseller or manufacturer, etc.
      - name: is_cat
        description: Indicating lead behaviour - cat.
      - name: is_eagle
        description: Indicating lead behaviour - eagle.
      - name: is_wolf
        description: Indicating lead behaviour - wolf.
      - name: is_shark
        description: Indicating lead behaviour - shark.
      - name: deleted
        description: Indicating deletion.
        tests:
          - not_null
      - name: valid_from
        description: Timestamp of data validity period - beginning.
        tests:
          - not_null
      - name: valid_to
        description: Timestamp of data validity period - end.
        tests:
          - not_null
      - name: is_current
        description: Indicating the latest data.
        tests:
          - accepted_values:
              values:
                - 0
                - 1
